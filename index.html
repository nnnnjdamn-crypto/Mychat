  <style>
:root {
  --bg: #F7F4EF;
  --sidebar: #EFEAE2;
  --card: #FFFFFF;
  --line: #E4DDD1;
  --ink: #2B2A28;
  --muted: #8A847A;
  --accent: #2F6F66;
  --accent-soft: #E3F0EC;
  --soft: #ECE6DC;
  --danger-bg: #F8E1DC;
  --danger-ink: #9A3412;
  --admin: #5B4B8A;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-size: 14px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pre { white-space: pre-line; }

/* Sign-in and verification */
.auth-wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 30px; }
.auth-card { width: 380px; max-width: 100%; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.brand img { width: 36px; height: 36px; }
.brand h1 { font-size: 22px; margin: 0; font-weight: 600; }
.brand p { margin: 0; font-size: 12px; }
.brand.small img { width: 26px; height: 26px; }
.brand.small strong { font-size: 17px; }
.tabs { display: flex; gap: 8px; margin: 18px 0 4px; }
.tabs .btn { flex: 1; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 14px; }
input { display: block; width: 100%; margin-top: 5px; padding: 10px; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; font: inherit; color: var(--ink); }
input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
label.check { display: flex; align-items: center; gap: 8px; font-weight: 400; color: var(--ink); }
label.check input { width: auto; margin: 0; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; margin-top: 12px; }
.link.center { display: block; margin: 10px auto 0; }
.status { min-height: 18px; margin: 12px 0 0; font-size: 13px; color: var(--danger-ink); }
.status.ok { color: var(--accent); }

/* Buttons */
.btn { border: 0; border-radius: 9px; padding: 9px 14px; font: inherit; font-weight: 500; cursor: pointer;
  color: #fff; background: var(--accent); transition: opacity .15s; }
.btn:hover { opacity: .88; }
.btn:active { opacity: .7; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); }
.btn.soft { background: var(--soft); color: var(--ink); }
.btn.danger { background: var(--danger-bg); color: var(--danger-ink); }
.btn.ink { background: var(--ink); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.admin { background: var(--admin); }
.btn.block { display: block; width: 100%; margin-top: 10px; }
.btn.small { padding: 4px 9px; font-size: 12px; font-weight: 500; }
.btn.recording { background: var(--danger-ink); color: #fff; }
.btn.tab-on { background: var(--accent); color: #fff; }
.btn.tab-off { background: var(--soft); color: var(--ink); }
.btn.emoji { font-size: 18px; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
.link-btn { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 12px; padding: 0 4px; }

/* Layout */
.app { display: grid; grid-template-columns: 248px 1fr; height: 100%; }
.sidebar { background: var(--sidebar); padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.main { display: flex; flex-direction: column; padding: 16px 18px 14px; min-width: 0; min-height: 0; position: relative; }
.search-row { display: flex; gap: 6px; }
.search-row input { margin-top: 0; }
.search-row .btn { padding: 9px 11px; }
.section-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px;
  font-weight: 600; color: var(--muted); margin-top: 8px; }
.list { list-style: none; margin: 0; padding: 0; overflow: auto; min-height: 0; flex: 1; }
.list.hidden { display: none; }
#searchResults { flex: none; max-height: 150px; }
.item { padding: 8px 10px; border-radius: 8px; cursor: pointer; margin: 1px 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.item:hover { background: #E6E0D4; }
.item.selected { background: var(--accent-soft); }

/* Top bar */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar h2 { margin: 0; font-size: 19px; font-weight: 600; }
.topbar p { margin: 2px 0 0; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* Messages */
.messages-wrap { flex: 1; min-height: 0; overflow: auto; margin-top: 12px; background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.messages { display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 10px; align-items: flex-start; }
.avatar { width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center;
  justify-content: center; color: #fff; font-weight: 600; flex: none; }
.bubble { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; max-width: 560px; }
.msg.own .bubble { background: var(--accent-soft); }
.meta { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.meta strong { color: var(--ink); }
.badge { color: var(--accent); }
.text { white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
.sticker { font-size: 38px; line-height: 1.1; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
.actions-row { margin-top: 6px; display: flex; gap: 6px; }

.join-row { display: flex; align-items: center; gap: 14px; margin-top: 12px; background: #fff;
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.composer { display: flex; gap: 8px; margin-top: 12px; }
.composer input { margin-top: 0; flex: 1; }
.status-line { margin: 10px 2px 0; min-height: 16px; }

.sticker-panel { position: absolute; bottom: 118px; right: 24px; width: 320px; max-height: 260px; overflow: auto;
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px;
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
.sticker-btn { border: 0; background: transparent; font-size: 22px; cursor: pointer; padding: 4px; border-radius: 6px;
  font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
.sticker-btn:hover { background: #F1EDE6; }

/* Dialogs */
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(440px, 92vw);
  background: #fff; color: var(--ink); }
dialog.wide { width: min(640px, 94vw); }
dialog::backdrop { background: rgba(43, 42, 40, .25); }
dialog h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
.section-title { margin: 14px 0 4px; font-size: 13px; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; margin-top: 16px; }
.profile-head { display: flex; align-items: center; gap: 14px; }
.big-avatar { width: 60px; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 24px; font-weight: 600; background: var(--accent); }
.admin-list { list-style: none; margin: 8px 0; padding: 0; max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.admin-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.admin-list li:last-child { border-bottom: 0; }
.admin-list .btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

/* Phones and narrow windows */
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100%; }
  .sidebar { max-height: 45vh; }
  .sticker-panel { right: 12px; }
}

/* ---- Desktop-style window (PC): fixed size, centred, title bar like the Windows app ---- */
html, body { background: #E9E4DB; }
body { display: flex; align-items: center; justify-content: center; padding: 16px; }

.window {
  width: min(1040px, 100%);
  height: min(680px, 100%);
  max-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border: 1px solid #D6CEC0;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(43, 42, 40, .18);
}
.titlebar {
  height: 36px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  background: var(--sidebar);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  user-select: none;
}
.titlebar img { width: 16px; height: 16px; }
.window-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.window-body > .app,
.window-body > .auth-wrap { flex: 1; min-height: 0; height: auto; }
.window .auth-wrap { min-height: 0; }
.window .app { height: 100%; }

/* Phones: no window frame, use the full screen */
@media (max-width: 760px) {
  body { padding: 0; background: var(--bg); display: block; }
  .window { width: 100%; height: 100vh; max-height: none; border: 0; border-radius: 0; box-shadow: none; }
  .titlebar { display: none; }
}

</style>

  recorder: null,
  recordTimer: null,
  lastNewestId: null,
  registerMode: false
};

const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "className") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== undefined && value !== null) node.setAttribute(key, value);
  }
  for (const child of children) if (child != null) node.append(child);
  return node;
}

function say(id, text, isError = false) {
  const node = $(id);
  node.textContent = text;
  node.style.color = isError ? "#9A3412" : "";
}

function friendly(error) {
  if (AUTH_MESSAGES[error?.code]) return AUTH_MESSAGES[error.code];
  if (error?.code === "permission-denied") return "Firebase blocked this action. Check that the rules are published and that your email is verified.";
  if (error?.code === "unavailable") return "Could not reach Firebase. Check your internet connection.";
  return error?.message || "Something went wrong.";
}

async function runAction(action, success = "", target = "chatStatus") {
  try {
    await action();
    if (success) say(target, success);
  } catch (error) {
    say(target, friendly(error), true);
  }
}

function setBusy(on) {
  state.busy = on;
  $("submitBtn").disabled = on;
  $("sendBtn").disabled = on;
}

function colorFor(name) {
  const sum = [...name].reduce((total, ch) => total + ch.charCodeAt(0), 0);
  return AVATAR_COLORS[sum % AVATAR_COLORS.length];
}

function initialOf(name) {
  return name ? name.charAt(0).toUpperCase() : "?";
}

function readProfile(uid, data) {
  return {
    uid,
    username: data.username || "",
    displayName: data.displayName || "",
    bio: data.bio || "",
    verified: !!data.verified,
    banned: !!data.banned
  };
}

// ---------- Screens ----------

function showOnly(view) {
  $("authView").classList.toggle("hidden", view !== "auth");
  $("verifyView").classList.toggle("hidden", view !== "verify");
  $("appView").classList.toggle("hidden", view !== "app");
}

function showAuth(message = "", isError = false) {
  showOnly("auth");
  say("authStatus", message, isError);
}

function showVerify(message) {
  showOnly("verify");
  $("verifyText").textContent = message;
  say("verifyStatus", "");
}

function setAuthMode(register) {
  state.registerMode = register;
  document.querySelectorAll(".register-only").forEach((node) => node.classList.toggle("hidden", !register));
  document.querySelectorAll(".sign-in-only").forEach((node) => node.classList.toggle("hidden", register));
  $("submitBtn").textContent = register ? "Create account" : "Sign in";
  $("tabSignIn").className = `btn ${register ? "tab-off" : "tab-on"}`;
  $("tabRegister").className = `btn ${register ? "tab-on" : "tab-off"}`;
  say("authStatus", "");
}

// ---------- Sign in and sign up ----------

function validateRegister() {
  const displayName = $("displayName").value.trim();
  const username = $("username").value.trim();
  const email = $("email").value.trim();
  const password = $("password").value;
  if (displayName.length < 2 || displayName.length > 30) return "Display name must be 2 to 30 characters.";
  if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) return "Username must be 3 to 20 letters, numbers or _.";
  if (!EMAIL_PATTERN.test(email)) return "Enter a valid email address.";
  if (password.length < 6) return "Password must be at least 6 characters.";
  if (password !== $("confirm").value) return "The two passwords do not match.";
  return null;
}

function validateSignIn() {
  if (!EMAIL_PATTERN.test($("email").value.trim())) return "Enter a valid email address.";
  if (!$("password").value) return "Enter your password.";
  return null;
}

async function createAccount(displayName, username, email, password) {
  const key = username.toLowerCase();
  if ((await getDoc(doc(db, "usernames", key))).exists()) throw new Error("That username is already taken.");

  const credential = await createUserWithEmailAndPassword(auth, email, password);
  const user = credential.user;
  const rollback = async () => {
    await deleteDoc(doc(db, "usernames", key)).catch(() => {});
    await deleteUser(user).catch(() => {});
  };

  try {
    await runTransaction(db, async (transaction) => {
      const ref = doc(db, "usernames", key);
      const snap = await transaction.get(ref);
      if (snap.exists()) throw new Error("taken");
      transaction.set(ref, { uid: user.uid });
    });
  } catch (error) {
    await rollback();
    throw new Error(error.message === "taken" ? "That username was just taken. Please choose another." : friendly(error));
  }

  try {
    await setDoc(doc(db, "users", user.uid), {
      username,
      searchName: key,
      displayName,
      bio: "",
      verified: false,
      banned: false,
      updatedAt: serverTimestamp()
    });
  } catch (error) {
    await rollback();
    throw error;
  }

  await sendEmailVerification(user).catch(() => {});
  state.user = user;
  showVerify(`We sent a verification link to ${email}. Open it, then press "I verified my email". Check your spam folder if you don't see it.`);
}

async function signIn(email, password, remember) {
  await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
  const credential = await signInWithEmailAndPassword(auth, email, password);
  await openSession(credential.user);
}

async function openSession(user) {
  try {
    await user.reload();
  } catch (_) {
    // Offline: keep the last known state.
  }

  const snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists()) {
    await signOut(auth);
    throw new Error("This account has no MyChat profile. Create a new account with a username.");
  }
  const profile = readProfile(user.uid, snap.data());
  if (profile.banned) {
    await signOut(auth);
    throw new Error("This account has been banned from MyChat.");
  }

  state.user = user;
  state.profile = profile;

  if (!user.emailVerified) {
    showVerify(`Your email (${user.email}) is not verified yet. Open the link we sent you, then press "I verified my email".`);
    return;
  }

  // A fresh token carries the email_verified claim the rules check.
  await user.getIdToken(true);
  state.isAdmin = (await getDoc(doc(db, "admins", user.uid))).exists();
  await ensureGeneralRoom();
  enterApp();
}

async function ensureGeneralRoom() {
  // Only verified users (or admins) can create channels. Anyone else gets an error, which is ignored.
  try {
    await setDoc(doc(db, "rooms", "general"), {
      name: "general",
      kind: "channel",
      createdBy: state.user.uid,
      members: [state.user.uid],
      createdAt: serverTimestamp()
    });
  } catch (_) {
    // Already exists, or not allowed yet.
  }
}

function enterApp() {
  showOnly("app");
  $("adminBtn").classList.toggle("hidden", !state.isAdmin);
  watchProfile();
  subscribeRooms();
}

async function signOutNow(message = "You have signed out.", isError = false) {
  stopVoice();
  unsubscribeAll();
  state.user = null;
  state.profile = null;
  state.isAdmin = false;
  state.room = null;
  state.rooms = [];
  state.roomGroups = { channels: [], mine: [] };
  state.latestDocs = [];
  state.olderDocs = [];
  state.profiles.clear();
  $("roomsList").replaceChildren();
  $("messages").replaceChildren();
  $("userInfo").textContent = "";
  updateRoomHeader();
  await signOut(auth).catch(() => {});
  showAuth(message, isError);
}

function unsubscribeAll() {
  if (state.unsubMessages) state.unsubMessages();
  if (state.unsubProfile) state.unsubProfile();
  state.unsubRooms.forEach((stop) => stop());
  state.unsubMessages = null;
  state.unsubProfile = null;
  state.unsubRooms = [];
}

// ---------- Live profile (verified badge, bans) ----------

function watchProfile() {
  const uid = state.user.uid;
  state.unsubProfile = onSnapshot(doc(db, "users", uid), (snap) => {
    if (!snap.exists()) return;
    const profile = readProfile(uid, snap.data());
    if (profile.banned) {
      signOutNow("This account has been banned from MyChat.", true);
      return;
    }
    state.profile = profile;
    $("userInfo").textContent = `@${profile.username}${profile.verified ? " ✔" : ""}\n${state.user.email}`;
    $("newChannelBtn").classList.toggle("hidden", !(profile.verified || state.isAdmin));
  }, (error) => say("chatStatus", friendly(error), true));
}

// ---------- Rooms ----------

function subscribeRooms() {
  const uid = state.user.uid;
  const onError = (error) => say("chatStatus", friendly(error), true);
  state.unsubRooms = [
    onSnapshot(query(collection(db, "rooms"), where("kind", "==", "channel"), limit(100)),
      (snap) => { state.roomGroups.channels = snap.docs.map(parseRoom); renderRooms(); }, onError),
    onSnapshot(query(collection(db, "rooms"), where("members", "array-contains", uid), limit(100)),
      (snap) => { state.roomGroups.mine = snap.docs.map(parseRoom); renderRooms(); }, onError)
  ];
}

function parseRoom(snap) {
  const data = snap.data();
  return {
    id: snap.id,
    name: data.name || "Untitled",
    kind: data.kind || "group",
    createdBy: data.createdBy || "",
    members: data.members || []
  };
}

function renderRooms() {
  const byId = new Map();
  for (const room of [...state.roomGroups.channels, ...state.roomGroups.mine]) byId.set(room.id, room);
  state.rooms = [...byId.values()].sort((a, b) =>
    (a.kind === "channel" ? 0 : 1) - (b.kind === "channel" ? 0 : 1) || a.name.localeCompare(b.name));

  const list = $("roomsList");
  list.replaceChildren(...state.rooms.map((room) => el("li", {
    className: `item${state.room?.id === room.id ? " selected" : ""}`,
    onclick: () => selectRoom(room),
    text: room.kind === "channel" ? `# ${room.name}` : room.name
  })));

  if (state.pendingSelect) {
    const found = state.rooms.find((room) => room.id === state.pendingSelect);
    if (found) {
      state.pendingSelect = null;
      selectRoom(found);
      return;
    }
  }
  if (state.room) {
    const current = state.rooms.find((room) => room.id === state.room.id);
    if (!current) clearRoom();
    else state.room = current;
  }
  if (!state.room && state.rooms.length) {
    selectRoom(state.rooms.find((room) => room.id === "general") || state.rooms[0]);
  }
  updateRoomHeader();
}

function selectRoom(room) {
  if (state.room?.id === room.id) {
    state.room = room;
    updateRoomHeader();
    renderRooms();
    return;
  }
  if (state.unsubMessages) state.unsubMessages();
  state.room = room;
  state.latestDocs = [];
  state.olderDocs = [];
  state.lastNewestId = null;
  $("messages").replaceChildren();
  state.unsubMessages = onSnapshot(
    query(collection(db, "rooms", room.id, "messages"), orderBy("createdAt", "desc"), limit(PAGE)),
    (snap) => {
      state.latestDocs = snap.docs;
      ensureProfiles(snap.docs);
      renderMessages(false);
    },
    (error) => say("chatStatus", friendly(error), true)
  );
  updateRoomHeader();
  renderRooms();
}

function clearRoom() {
  if (state.unsubMessages) state.unsubMessages();
  state.unsubMessages = null;
  state.room = null;
  state.latestDocs = [];
  state.olderDocs = [];
  $("messages").replaceChildren();
  updateRoomHeader();
}

function updateRoomHeader() {
  const room = state.room;
  const me = state.user?.uid;
  const hide = (id, hidden) => $(id).classList.toggle("hidden", hidden);

  if (!room) {
    $("roomTitle").textContent = "Select a room";
    $("roomInfo").textContent = "Pick a channel or group on the left.";
    ["composer", "joinRow", "addMemberBtn", "deleteRoomBtn", "loadOlderBtn"].forEach((id) => hide(id, true));
    return;
  }

  const member = room.members.includes(me);
  $("roomTitle").textContent = room.kind === "channel" ? `# ${room.name}` : room.name;
  $("roomInfo").textContent = `${room.kind === "channel" ? "Public channel" : "Private group"} · ${room.members.length} member(s)`;
  hide("composer", !member);
  hide("joinRow", !(room.kind === "channel" && !member));
  hide("addMemberBtn", !(room.kind === "group" && member));
  hide("deleteRoomBtn", !(state.isAdmin || room.createdBy === me));
  hide("loadOlderBtn", false);
}

async function createRoom(kind) {
  const name = await askText(kind === "channel" ? "New channel" : "New group", "Name (1-40 characters):");
  if (!name) return;
  if (name.length > 40) return say("chatStatus", "Names can be at most 40 characters.", true);
  const uid = state.user.uid;
  await runAction(async () => {
    const ref = await addDoc(collection(db, "rooms"), {
      name, kind, createdBy: uid, members: [uid], createdAt: serverTimestamp()
    });
    state.pendingSelect = ref.id;
  }, `Created ${name}.`);
}

async function joinRoom() {
  const room = state.room;
  if (!room) return;
  await runAction(() => updateDoc(doc(db, "rooms", room.id), { members: arrayUnion(state.user.uid) }),
    "You joined the channel.");
}

async function addMember() {
  const room = state.room;
  if (!room || room.kind !== "group") return;
  const username = await askText("Add member", "Username to add to this group:");
  if (!username) return;
  await runAction(async () => {
    const found = await getDoc(doc(db, "usernames", username.toLowerCase()));
    if (!found.exists()) throw new Error(`No user named @${username}.`);
    const uid = found.data().uid;
    if (room.members.includes(uid)) throw new Error(`@${username} is already in this group.`);
    await updateDoc(doc(db, "rooms", room.id), { members: arrayUnion(uid) });
  }, `Added @${username}.`);
}

async function deleteRoom() {
  const room = state.room;
  if (!room) return;
  if (!window.confirm(`Delete ${room.name}? It will disappear for everyone.`)) return;
  await runAction(async () => {
    await deleteDoc(doc(db, "rooms", room.id));
    clearRoom();
  }, "Room deleted.");
}

// ---------- Messages ----------

function messageTime(snap) {
  const stamp = snap.data().createdAt;
  return stamp ? stamp.toMillis() : Number.MAX_SAFE_INTEGER;
}

function renderMessages(scrollToEnd) {
  const seen = new Map();
  for (const snap of [...state.olderDocs, ...state.latestDocs]) {
    if (!seen.has(snap.id)) seen.set(snap.id, snap);
  }
  const newestFirst = [...seen.values()].sort((a, b) => messageTime(b) - messageTime(a));
  const oldestFirst = newestFirst.reverse();

  $("messages").replaceChildren(...oldestFirst.map(messageNode));

  const newestId = oldestFirst.length ? oldestFirst[oldestFirst.length - 1].id : null;
  if (scrollToEnd || newestId !== state.lastNewestId) {
    const wrap = $("messagesWrap");
    wrap.scrollTop = wrap.scrollHeight;
  }
  state.lastNewestId = newestId;
}

function messageNode(snap) {
  const m = snap.data();
  const me = state.user?.uid;
  const own = m.senderUid === me;
  const name = m.senderName || "Unknown";
  const profile = state.profiles.get(m.senderUid);
  const when = m.createdAt ? m.createdAt.toDate() : new Date();

  const body = [];
  if (m.sticker) body.push(el("div", { className: "sticker", text: m.sticker }));
  if (m.text) body.push(el("div", { className: "text", text: m.text }));
  if (m.audio) {
    body.push(el("div", { className: "actions-row" },
      el("button", { className: "btn soft small", type: "button", text: "▶ Play voice",
        onclick: () => playAudio(m.audio, m.audioType) })));
  }

  const canDelete = own || state.isAdmin;
  const actions = canDelete
    ? el("div", { className: "actions-row" },
        el("button", { className: "btn danger small", type: "button", text: "Delete",
          onclick: () => deleteMessage(snap.id) }))
    : null;

  return el("div", { className: `msg${own ? " own" : ""}` },
    el("div", { className: "avatar", style: `background:${colorFor(name)}`, text: initialOf(name) }),
    el("div", { className: "bubble" },
      el("div", { className: "meta" },
        el("strong", { text: name }),
        profile?.verified ? el("span", { className: "badge", text: " ✔" }) : null,
        el("span", { text: `  ·  ${when.toLocaleString([], { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "short", year: "numeric" })}` })),
      ...body,
      actions));
}

function ensureProfiles(snaps) {
  for (const snap of snaps) {
    const uid = snap.data().senderUid;
    if (!uid || state.profiles.has(uid)) continue;
    state.profiles.set(uid, null);
    getDoc(doc(db, "users", uid)).then((profileSnap) => {
      state.profiles.set(uid, profileSnap.exists() ? readProfile(uid, profileSnap.data()) : null);
      renderMessages(false);
    }).catch(() => {});
  }
}

async function sendMessage(fields) {
  const room = state.room;
  const user = state.user;
  if (!room || !user || !state.profile) throw new Error("Open a room first.");
  if (!room.members.includes(user.uid)) throw new Error("Join this channel before sending messages.");

  await addDoc(collection(db, "rooms", room.id, "messages"), {
    text: fields.text || "",
    sticker: fields.sticker || "",
    audio: fields.audio || "",
    ...(fields.audio ? { audioType: fields.audioType || "audio/webm" } : {}),
    senderUid: user.uid,
    senderName: state.profile.username,
    createdAt: serverTimestamp()
  });
}

async function loadOlder() {
  const room = state.room;
  if (!room) return;
  const oldest = state.olderDocs.length
    ? state.olderDocs[state.olderDocs.length - 1]
    : state.latestDocs[state.latestDocs.length - 1];
  if (!oldest) return say("chatStatus", "No messages to load before this one.");

  await runAction(async () => {
    const snap = await getDocs(query(collection(db, "rooms", room.id, "messages"),
      orderBy("createdAt", "desc"), startAfter(oldest), limit(PAGE)));
    if (snap.empty) return say("chatStatus", "No older messages.");
    ensureProfiles(snap.docs);
    state.olderDocs = [...state.olderDocs, ...snap.docs];
    renderMessages(false);
  });
}

async function deleteMessage(id) {
  const room = state.room;
  if (!room || !window.confirm("Delete this message?")) return;
  await runAction(() => deleteDoc(doc(db, "rooms", room.id, "messages", id)), "Message deleted.");
}

// ---------- Stickers ----------

function buildStickerPanel() {
  $("stickerPanel").replaceChildren(...STICKERS.map((sticker) => el("button", {
    className: "sticker-btn",
    type: "button",
    text: sticker,
    onclick: async () => {
      $("stickerPanel").classList.add("hidden");
      await runAction(() => sendMessage({ sticker }));
    }
  })));
}

// ---------- Voice messages ----------

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

async function toggleVoice() {
  if (state.recorder) return stopVoice();
  if (!window.MediaRecorder || !navigator.mediaDevices) {
    return say("chatStatus", "This browser cannot record audio.", true);
  }
  if (!state.room?.members.includes(state.user.uid)) {
    return say("chatStatus", "Join this channel before sending voice messages.", true);
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (_) {
    return say("chatStatus", "Microphone access was blocked. Allow it in your browser settings.", true);
  }

  const mimeType = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"]
    .find((type) => MediaRecorder.isTypeSupported(type)) || "";
  const recorder = new MediaRecorder(stream, { ...(mimeType ? { mimeType } : {}), audioBitsPerSecond: 32000 });
  const chunks = [];
  recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
  recorder.onstop = async () => {
    stream.getTracks().forEach((track) => track.stop());
    const type = (recorder.mimeType || "audio/webm").split(";")[0];
    const base64 = await blobToBase64(new Blob(chunks, { type: recorder.mimeType || "audio/webm" }));
    if (base64.length > MAX_AUDIO_CHARS) return say("chatStatus", "That voice message is too long. Keep it under 10 seconds.", true);
    await runAction(() => sendMessage({ audio: base64, audioType: type }), "Voice message sent.");
  };

  recorder.start();
  state.recorder = recorder;
  state.recordTimer = setTimeout(stopVoice, MAX_VOICE_MS);
  $("voiceBtn").textContent = "■ Stop (10 s max)";
  $("voiceBtn").classList.add("recording");
  say("chatStatus", "Recording... press Stop to send.");
}

function stopVoice() {
  clearTimeout(state.recordTimer);
  if (state.recorder && state.recorder.state !== "inactive") state.recorder.stop();
  state.recorder = null;
  $("voiceBtn").textContent = "● Voice";
  $("voiceBtn").classList.remove("recording");
}

function playAudio(base64, type) {
  const audio = new Audio(`data:${type || "audio/wav"};base64,${base64}`);
  audio.play().catch(() => say("chatStatus", "Could not play this voice message.", true));
}

// ---------- Search, profiles, follows ----------

async function runSearch() {
  const term = $("searchBox").value.trim().toLowerCase();
  const list = $("searchResults");
  list.replaceChildren();
  list.classList.add("hidden");
  if (term.length < 2) return say("searchInfo", "Type at least 2 letters of a username.");

  await runAction(async () => {
    const exact = await getDoc(doc(db, "usernames", term));
    if (exact.exists()) {
      say("searchInfo", "");
      return openProfile(exact.data().uid);
    }

    const prefix = term.slice(0, 2);
    const hits = await getDocs(query(collection(db, "users"),
      where("searchName", ">=", prefix), where("searchName", "<", prefix + "\uf8ff"), limit(10)));
    if (hits.empty) return say("searchInfo", `No user found for "${term}".`);

    say("searchInfo", "No exact match. Similar accounts:");
    list.classList.remove("hidden");
    list.replaceChildren(...hits.docs.map((snap) => {
      const p = readProfile(snap.id, snap.data());
      return el("li", {
        className: "item",
        onclick: () => { list.classList.add("hidden"); openProfile(p.uid); },
        text: `@${p.username}${p.verified ? " ✔" : ""}   ${p.displayName}`
      });
    }));
  }, "", "searchInfo");
}

async function openProfile(uid) {
  const me = state.user.uid;
  const snap = await getDoc(doc(db, "users", uid));
  if (!snap.exists()) return say("chatStatus", "This profile no longer exists.", true);
  const p = readProfile(uid, snap.data());

  const [followers, following, followDoc] = await Promise.all([
    getDocs(query(collection(db, "follows"), where("followed", "==", uid), limit(1000))),
    getDocs(query(collection(db, "follows"), where("follower", "==", uid), limit(1000))),
    uid === me ? Promise.resolve(null) : getDoc(doc(db, "follows", `${me}_${uid}`))
  ]);

  state.viewingUid = uid;
  state.viewingFollowing = !!(followDoc && followDoc.exists());

  const name = p.displayName || p.username;
  const avatar = $("profInitial");
  avatar.textContent = initialOf(name);
  avatar.style.background = colorFor(name);
  $("profName").textContent = name + (p.verified ? " ✔" : "");
  $("profUser").textContent = `@${p.username}`;
  $("profBio").textContent = p.bio || "No bio yet.";
  $("profCounts").textContent = `${followers.size} followers · ${following.size} following`;
  $("followBtn").textContent = state.viewingFollowing ? "Unfollow" : "Follow";
  $("followBtn").classList.toggle("hidden", uid === me);
  $("editBtn").classList.toggle("hidden", uid !== me);
  say("profileStatus", "");
  $("profileDialog").showModal();
}

// ---------- Admin ----------

function adminButton(label, onclick, kind = "soft") {
  return el("button", { className: `btn small ${kind}`, type: "button", text: label, onclick });
}

async function loadAdmin() {
  await Promise.all([loadAdminUsers(), loadAdminRooms()]);
}

async function loadAdminUsers() {
  const filter = $("adminSearch").value.trim().toLowerCase();
  const snap = await getDocs(query(collection(db, "users"), limit(500)));
  const rows = [];
  for (const userSnap of snap.docs) {
    const p = readProfile(userSnap.id, userSnap.data());
    if (filter && !p.username.toLowerCase().includes(filter) && !p.displayName.toLowerCase().includes(filter)) continue;
    rows.push(el("li", {},
      el("span", { text: `@${p.username}${p.verified ? " ✔" : ""}${p.banned ? "  [BANNED]" : ""}` }),
      el("span", { className: "btns" },
        adminButton(p.verified ? "Remove verified" : "Verify", () => setFlag(p.uid, "verified", !p.verified)),
        adminButton(p.banned ? "Unban" : "Ban", () => setFlag(p.uid, "banned", !p.banned), p.banned ? "soft" : "danger"))));
  }
  $("adminUsers").replaceChildren(...rows);
}

async function loadAdminRooms() {
  const snap = await getDocs(query(collection(db, "rooms"), limit(500)));
  $("adminRooms").replaceChildren(...snap.docs.map((roomSnap) => {
    const room = parseRoom(roomSnap);
    return el("li", {},
      el("span", { text: `${room.kind === "channel" ? "# " : ""}${room.name} (${room.kind})` }),
      el("span", { className: "btns" },
        adminButton("Delete", async () => {
          if (!window.confirm(`Delete ${room.name}?`)) return;
          await runAction(async () => {
            await deleteDoc(doc(db, "rooms", room.id));
            await loadAdminRooms();
          }, "Room deleted.", "adminStatus");
        }, "danger")));
  }));
}

async function setFlag(uid, field, value) {
  if (field === "banned" && value && uid === state.user.uid) {
    return say("adminStatus", "You cannot ban your own account.", true);
  }
  await runAction(async () => {
    await updateDoc(doc(db, "users", uid), { [field]: value });
    await loadAdminUsers();
  }, `Updated ${field}.`, "adminStatus");
}

// ---------- Text prompt ----------

function askText(title, prompt, initial = "", max = 160) {
  return new Promise((resolve) => {
    $("askTitle").textContent = title;
    $("askPrompt").textContent = prompt;
    const input = $("askInput");
    input.value = initial;
    input.maxLength = max;
    const dialog = $("askDialog");
    const onClose = () => {
      dialog.removeEventListener("close", onClose);
      resolve(dialog.returnValue === "ok" ? input.value.trim() : null);
    };
    dialog.addEventListener("close", onClose);
    dialog.showModal();
    input.focus();
  });
}

// ---------- Wiring ----------

$("tabSignIn").addEventListener("click", () => setAuthMode(false));
$("tabRegister").addEventListener("click", () => setAuthMode(true));

$("authForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (state.busy) return;
  const email = $("email").value.trim();
  const password = $("password").value;
  const error = state.registerMode ? validateRegister() : validateSignIn();
  if (error) return say("authStatus", error, true);

  setBusy(true);
  say("authStatus", "Please wait...");
  try {
    if (state.registerMode) {
      await createAccount($("displayName").value.trim(), $("username").value.trim(), email, password);
    } else {
      await signIn(email, password, $("remember").checked);
    }
  } catch (err) {
    say("authStatus", friendly(err), true);
  } finally {
    setBusy(false);
  }
});

$("forgotBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!EMAIL_PATTERN.test(email)) return say("authStatus", "Type your email above first.", true);
  try {
    await sendPasswordResetEmail(auth, email);
    say("authStatus", "If an account exists for that email, a reset link is on its way.");
  } catch (err) {
    say("authStatus", friendly(err), true);
  }
});

$("verifyCheckBtn").addEventListener("click", async () => {
  if (!auth.currentUser) return showAuth("Sign in again.", true);
  setBusy(true);
  try {
    await openSession(auth.currentUser);
  } catch (err) {
    say("verifyStatus", friendly(err), true);
  } finally {
    setBusy(false);
  }
});

$("verifyResendBtn").addEventListener("click", async () => {
  if (!auth.currentUser) return showAuth("Sign in again.", true);
  await runAction(() => sendEmailVerification(auth.currentUser), "Verification email sent again.", "verifyStatus");
});

$("verifyBackBtn").addEventListener("click", () => signOutNow("Sign in after you have verified your email."));
$("signOutBtn").addEventListener("click", () => signOutNow());

$("searchBtn").addEventListener("click", runSearch);
$("searchBox").addEventListener("keydown", (event) => { if (event.key === "Enter") runSearch(); });
$("newChannelBtn").addEventListener("click", () => createRoom("channel"));
$("newGroupBtn").addEventListener("click", () => createRoom("group"));
$("myProfileBtn").addEventListener("click", () => openProfile(state.user.uid));
$("joinBtn").addEventListener("click", joinRoom);
$("addMemberBtn").addEventListener("click", addMember);
$("deleteRoomBtn").addEventListener("click", deleteRoom);
$("loadOlderBtn").addEventListener("click", loadOlder);

$("composer").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = $("messageInput").value.trim();
  if (!text) return say("chatStatus", "Type a message before sending.", true);
  if (text.length > 1000) return say("chatStatus", "Messages can be at most 1000 characters.", true);
  await runAction(async () => {
    await sendMessage({ text });
    $("messageInput").value = "";
  });
});

$("stickerBtn").addEventListener("click", () => $("stickerPanel").classList.toggle("hidden"));
$("voiceBtn").addEventListener("click", toggleVoice);

$("followBtn").addEventListener("click", () => runAction(async () => {
  const id = `${state.user.uid}_${state.viewingUid}`;
  if (state.viewingFollowing) {
    await deleteDoc(doc(db, "follows", id));
  } else {
    await setDoc(doc(db, "follows", id), {
      follower: state.user.uid,
      followed: state.viewingUid,
      createdAt: serverTimestamp()
    });
  }
  await openProfile(state.viewingUid);
}, "", "profileStatus"));

$("editBtn").addEventListener("click", async () => {
  const bio = await askText("Edit profile", "Bio (up to 160 characters, leave empty to clear):", state.profile.bio, 160);
  if (bio === null) return;
  await runAction(async () => {
    await updateDoc(doc(db, "users", state.user.uid), { bio });
    await openProfile(state.user.uid);
  }, "", "profileStatus");
});

$("closeProfile").addEventListener("click", () => $("profileDialog").close());

$("adminBtn").addEventListener("click", async () => {
  if (!state.isAdmin) return;
  $("adminDialog").showModal();
  await runAction(loadAdmin, "", "adminStatus");
});
$("adminSearch").addEventListener("input", () => runAction(loadAdminUsers, "", "adminStatus"));
$("closeAdmin").addEventListener("click", () => $("adminDialog").close());

// Start: restore a saved session, or show sign-in.
buildStickerPanel();
setAuthMode(false);
let started = false;
onAuthStateChanged(auth, async (user) => {
  if (started) return;
  started = true;
  if (!user) return showAuth("");
  try {
    await openSession(user);
  } catch (err) {
    showAuth(friendly(err), true);
  }
});

</script>
</body>
